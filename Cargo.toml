[workspace]
resolver = "2"
members = ["crates/recon-core", "crates/recon-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/ggsurkov/csp-recon-analyzer"
authors = ["Georgy <ggsurkov@gmail.com>"]

[workspace.dependencies]
csv = "1.3"
flate2 = "1.0"
rust_decimal = "1"
rust_decimal_macros = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
